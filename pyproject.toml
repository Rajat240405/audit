[project]
name = "parliamentary-rag"
version = "0.1.0"
description = "Hybrid RAG vs GraphRAG on Parliamentary Q&A Data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Parliamentary RAG Team" }
]
keywords = ["rag", "graphrag", "retrieval", "llm", "parliamentary"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # HTTP & scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.44.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Config
    "pyyaml>=6.0.0",

    # CLI & output
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",

    # JSON handling
    "orjson>=3.10.0",

    # Numerical, ML & IR (introduced in Phase 2)
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "networkx>=3.0.0",
    "matplotlib>=3.7.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0.0",
    # Table-aware PDF extraction; AGPL-3.0/commercial — scraper falls back
    # to pypdf when absent (see src/data/pdf_table_extract.py)
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "neo4j>=5.14.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "dirty-equals>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
ingest = "src.data.ingestion_pipeline:cli"
retrieve = "src.retrieval.cli:cli"
evaluate = "src.retrieval.evaluation.cli:evaluate_cli"
graph = "src.retrieval.graph.cli:graph_cli"
graphrag = "src.graphrag.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
