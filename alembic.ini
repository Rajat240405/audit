# Alembic configuration — AuditPro / INCOIS PostgreSQL schema migrations.
#
# The connection URL is deliberately NOT set here. It is resolved in
# alembic/env.py from src.db.config (environment-driven), so:
#   * no credential is ever written into a tracked file;
#   * the same code serves local Docker and HPC with different env values.
#
# Run from the repository root:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade base        # undo everything (DESTRUCTIVE)
#   alembic current               # what the database is at
#   alembic heads                 # must always report exactly ONE head
#   alembic upgrade head --sql    # render the SQL without connecting
#
# See docs/database-setup.md.

[alembic]
script_location = alembic
prepend_sys_path = .
# Revision filenames: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

# NOTE: left empty on purpose — alembic/env.py overrides it with the
# password-masked URL so the credential can never be logged.
sqlalchemy.url =

[post_write_hooks]
# Applied to every newly generated revision file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
