# Source-aware ingestion registry — consumed by `python -m src.scripts.ingest`.
#
# This file is DATA, not code: a new ministry/organization is a config entry
# (or just a new folder under data/ — see `discovery:`), never a change to the
# ingestion engine (src/scripts/ingest.py reuses src/scripts/ingest_folder.py).
#
# Hierarchy convention (Phase 1):
#   data/<source>/[<org-segment>/]<category-segment>/<files>
# The walker (ingest.py) resolves identity from the path:
#   moes/incois/annual_reports/x.pdf  ->  source=moes, org=incois,
#                                         document_type=annual_report
# Segments before the FIRST category_map match form the org (first segment
# wins); a root whose files sit directly inside uses default_org + the
# engine's legacy content/filename detection. Stamped metadata reaches the
# retrieval layer via doc_map (org is filterable; source is provenance;
# document_type drives the category axis via org_tree).

version: 1

# ── Hierarchy defaults (global; per-source may override) ────────────────────
# Leaf directory name -> document_type. Case-insensitive. Values reuse the
# EXISTING document_type vocabulary so the query-side maps keep working
# (research_papers -> research_publication, NOT a new type). "audit_report"
# is the only new value (mapped to the "audit" category in org_tree).
hierarchy:
  category_map:
    annual_reports:  annual_report
    audit_reports:   audit_report
    research_papers: research_publication
    press_release:   press_release
    other:           document

sources:

  inbox:
    kind: folders
    folders: [inbox]
    move_processed: true          # files move to inbox/processed — frontend UI contract
    description: >
      Frontend uploads and manual drop-ins (Settings -> "Upload & Ingest").
      Server /api/ingest ingests this same folder; keep these semantics in
      lockstep with src/retrieval/frontend/server.py.

  parliament:
    kind: records
    record_dirs: [enriched, processed]
    description: >
      Parliamentary Q&A produced by the Phase-1 pipeline
      (src/data/ingestion_pipeline.py -> data/processed/, optionally
      data/enriched/). Records are merged as-is (ids preserved); enriched
      files take precedence over processed on duplicate question_id.
      Scraping itself stays in the Phase-1 pipeline — this source only
      pulls its OUTPUT into the canonical corpus.
      RETIRES AT THE LOK SABHA CUTOVER: once the lok_sabha staged corpus is
      validated, this block is removed in the same operator step that
      rebuilds the corpus (ids 8-12-0102 vs ls-8-12-0102 must never
      co-live — see ls_scraper_plan/REPORT.md §7, risk 6).

  lok_sabha:
    kind: records
    record_dirs: [parliamentary-qa/lok-sabha]
    recursive: true               # one qa.jsonl per lok-<n>/session-<m>/
    description: >
      Staged Lok Sabha Q&A produced by the LS crawler
      (python -m src.scraping.ls.pipeline -> parliamentary-qa/
      lok-sabha/lok-<n>/session-<m>/qa.jsonl). The records-kind merge
      recurses into the composite (loksabha × session) layout via the same
      generic `recursive` capability rajya_sabha uses — no LS special-casing
      in the engine; ids are preserved (ls-<lok>-<ses>-<qno>), and the rich
      staged metadata (house/loksabha/ministry/subject/doc URLs) rides into
      the corpus untouched. Rows whose official answer document is still
      missing (empty question/answer text) are skipped WITH a logged count —
      content is never faked. `parliamentary-qa` is also in
      discovery.exclude_dirs so automatic discovery never half-ingests the
      staging tree as a folder source. NOTE: do NOT run this against a
      corpus that `parliament` already filled — the cutover is a one-step
      swap (remove `parliament`, rebuild) per REPORT.md §7.

  rajya_sabha:
    kind: records
    record_dirs: [parliamentary-qa/rajya-sabha]
    recursive: true               # one qa.jsonl per session-<n>/ directory
    description: >
      Staged Rajya Sabha Q&A produced by the RS crawler
      (src/scripts/crawl_parliamentary_qa.py -> parliamentary-qa/
      rajya-sabha/session-<n>/qa.jsonl). The records-kind merge recurses
      into the session layout (generic capability — no RS special-casing in
      the engine), ids are preserved (rs-<session>-<qno>), and the rich
      staged metadata (house=qslno/ministry/doc URLs) rides into the
      corpus untouched. Rows whose official answer document is still
      missing (empty answer_text) are skipped WITH a logged count — the
      eParlib backfill runbook recovers them; content is never faked.
      `parliamentary-qa` is also in discovery.exclude_dirs so automatic
      discovery never half-ingests the staging tree as a folder source.

  # ── Hierarchical sources ── ministry root, org subtree ────────────────────
  moes:
    kind: folders
    folders: [moes]
    hierarchical: true
    ministry: EARTH SCIENCES
    default_org: moes_hq          # files directly under data/moes/ (or an
                                  # unmapped org segment) land on the HQ org
    org_map:                      # directory segment -> ORG_TREE slug (config!)
      ministry: moes_hq
      incois: incois
      imd: imd
      iitm: iitm
      niot: niot
    description: >
      Ministry of Earth Sciences knowledge tree:
        data/moes/{ministry,incois,imd,iitm,...}/{annual_reports,
        audit_reports,research_papers,other}/<files>
      New orgs need at most one org_map line here (directory convention works
      even without it — an unmapped segment becomes the org slug verbatim,
      lowercased).

  # ── Flat legacy sources (kept; supersede by moving files into the tree) ───
  incois:
    kind: folders
    org: incois                   # flat source WITH explicit org stamp
    ministry: EARTH SCIENCES
    folders:
      - annual_reports                        # legacy crawl_annual_reports location
      - incois_reports/AnnualReports
      - incois_reports/Others
      - incois_reports/TechnicalReports
      - incois_reports/ResearchPublications
      - scanned_ocr                           # ocr_pdfs.py output (scanned PDFs -> .txt)
    description: >
      Legacy flat INCOIS crawler layout (crawl_incois_reports sections +
      scanned OCR). Identical files under the new moes/incois tree and here
      dedupe by content hash — safe to run both during migration.

  moes_reports:
    kind: folders
    org: moes_hq
    ministry: EARTH SCIENCES
    folders: [moes_reports/knowledge]
    description: >
      Legacy MoES CCPS knowledge JSONs (crawl_moes_reports). Root-level
      moes_reports/*.pdf are crawler downloads only; the ingestible form is
      the knowledge/*.json extraction.

  moes_website:
    kind: folders
    folders: [.moes-website]
    hierarchical: true
    ministry: EARTH SCIENCES
    default_org: moes_hq
    org_map:
      reports: moes_hq            # reports/annual-reports/<slug>/documents/
    exclude_files:                # crawler sidecars living next to documents —
      - record.json               # generic file-name exclusion (exact names,
      - manifest.json             # case-insensitive), NOT MoES-specific code
      - attachment-map.json       # in the engine: without it record.json would
      - last_run.json             # be converted into ~215 junk stub records.
    present_in_tree: false        # records belong to EXISTING moes orgs
                                  # (annual_reports/press_release -> moes_hq);
                                  # hidden so the tree gains no empty
                                  # "Moes Website" ministry node.
    description: >
      MoES website staging corpus written by the dedicated website crawler
      (src/scripts/crawl_moes_website.py -> data/.moes-website/). Layout:
      reports/annual-reports/<post>/documents/<file.pdf> and
      press-release/<post>/documents/<file.pdf>. The first category_map hit
      resolves document_type (annual_report / press_release); org resolves
      through org_map/default_org to moes_hq. Crawling and ingestion stay
      separate stages: the crawler only writes staging bytes, this source
      only pulls its OUTPUT into the canonical corpus (the engine never
      mutates the staging tree — move_processed is false for hierarchical
      sources). The dot-dir name also keeps automatic discovery away.

# ── Presentation layer (filter tree + labels; consumed by org_tree.py) ──────
# Identity and DISPLAY knowledge for the retrieval source filter — what the
# backend catalogue exposes and the frontend renders. COUNTS NEVER LIVE HERE:
# build_sources_catalogue() always counts the actual indexed corpus.
#
#   ministries:        filter-tree nodes. Org entries take the short form
#                      `slug: "Display Name"` or the extended form shown below.
#                      This block is MERGED with hierarchical sources from the
#                      registry above: a NEW hierarchical source (e.g.
#                      rajat_reports) appears in the tree automatically with a
#                      deterministic label (slug -> "Rajat Reports"); entries
#                      here only override/prettify labels and category hints.
#                      Ministries that have no registry source yet (sansad,
#                      moa, mof) are declared here directly.
#   categories:        doc_category -> UI label (optional; unknown categories
#                      get a deterministic label from the slug).
#   doctype_categories: document_type -> doc_category (the cadence axis used
#                      by the facets). New document_types added to
#                      hierarchy.category_map above should get a line here;
#                      unmapped types fall back to "misc" as before.
presentation:
  ministries:
    sansad:
      name: "Sansad (Parliament Q&A)"
      orgs:
        sansad: {name: "Parliamentary Questions", categories: [parliamentary]}
    moes:
      name: "Ministry of Earth Sciences"
      orgs:
        incois:   {name: "INCOIS",  categories: [annual, scientific, technical, general]}
        imd:      {name: "IMD",     categories: [annual, monthly, scientific]}
        iitm:     {name: "IITM",    categories: [annual, scientific]}
        niot:     {name: "NIOT",    categories: [annual, research]}
        moes_hq:  {name: "MoES HQ", categories: [annual, monthly, budget, policy, gazette, news, scientific, misc]}
    moa:
      name: "Ministry of Agriculture & Farmers Welfare"
      orgs:
        moa_hq: {name: "MoA HQ", categories: [annual, monthly, budget, policy]}
    mof:
      name: "Ministry of Finance"
      orgs:
        mof_hq: {name: "MoF HQ", categories: [annual, budget, policy]}
  categories:
    parliamentary: Parliamentary Questions
    annual: Annual Reports
    monthly: Monthly Reports
    quarterly: Quarterly Reports
    scientific: Scientific / Research
    technical: Technical Reports
    general: General Reports
    audit: Audit Reports
    budget: Budget / Grants
    policy: Policy Documents
    gazette: Gazettes / Notices
    news: Newsletters / News
    misc: Misc
  doctype_categories:
    parliamentary_qa: parliamentary
    annual_report: annual
    monthly_report: monthly
    research_publication: scientific
    publication: scientific
    bibliometrics: scientific
    technical_report: technical
    general_report: general
    audit_report: audit
    demands_for_grants: budget
    performance_budget: budget
    gazette_notification: gazette
    order_notice: gazette
    newsletter: news
    press_release: news           # MoES website press-release/ tree (IW-4)
    download: misc
    document: misc

# ── Automatic source-directory discovery ────────────────────────────────────
# `ingest all` and `ingest <name>` fall back to discovery when <name> is not
# registered above: any FIRST-LEVEL directory under the data root that isn't
# claimed by a registered source (a hierarchical root claims its whole
# subtree), isn't in exclude_dirs, isn't hidden, and contains ingestible
# files (pdf/txt/md/json/jsonl — checked recursively) is ingestible as a
# HIERARCHICAL source named after the directory (default_org = dir name,
# ministry unknown -> metadata.ministry stays None rather than mislabeling
# it; Earth Sciences was a temporary scope, never a default for new sources).
discovery:
  enabled: true
  exclude_dirs:
    - processed        # claimed by parliament (records kind)
    - enriched         # claimed by parliament (records kind)
    - parliamentary-qa # claimed by rajya_sabha + lok_sabha (records kind,
                       # recursive, disjoint house subtrees) — discovery must
                       # never half-ingest individual session folders as
                       # folder source(s)
    - raw              # Phase-1 scraper intermediate — never ingested directly
    - finetune         # training data, not a retrieval source
    - user-knowledge   # separate curated exact-match store (not corpus)
